services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: loanflow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: loanflow-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # ── PostgreSQL Databases (one per service, shared image) ──────────────

  postgres-application:
    image: postgres:16-alpine
    container_name: loanflow-postgres-application
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: applicationdb
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    volumes:
      - pgdata-application:/var/lib/postgresql/data

  postgres-credit:
    image: postgres:16-alpine
    container_name: loanflow-postgres-credit
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: creditdb
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    volumes:
      - pgdata-credit:/var/lib/postgresql/data

  postgres-underwriting:
    image: postgres:16-alpine
    container_name: loanflow-postgres-underwriting
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: underwritingdb
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    volumes:
      - pgdata-underwriting:/var/lib/postgresql/data

  postgres-disbursement:
    image: postgres:16-alpine
    container_name: loanflow-postgres-disbursement
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: disbursementdb
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    volumes:
      - pgdata-disbursement:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:16-alpine
    container_name: loanflow-postgres-notification
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
    volumes:
      - pgdata-notification:/var/lib/postgresql/data

  # ── Application Services ──────────────────────────────────────────────

  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    container_name: loanflow-application-service
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres-application
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres-application

  credit-scoring-service:
    build:
      context: .
      dockerfile: credit-scoring-service/Dockerfile
    container_name: loanflow-credit-scoring-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - postgres-credit
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres-credit

  underwriting-service:
    build:
      context: .
      dockerfile: underwriting-service/Dockerfile
    container_name: loanflow-underwriting-service
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres-underwriting
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres-underwriting

  disbursement-service:
    build:
      context: .
      dockerfile: disbursement-service/Dockerfile
    container_name: loanflow-disbursement-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - postgres-disbursement
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres-disbursement

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: loanflow-notification-service
    ports:
      - "8085:8085"
    depends_on:
      - kafka
      - postgres-notification
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres-notification

  frontend:
    image: nginx:alpine
    container_name: loanflow-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  pgdata-application:
  pgdata-credit:
  pgdata-underwriting:
  pgdata-disbursement:
  pgdata-notification:
