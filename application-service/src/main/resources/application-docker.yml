# Profile activated when running inside Docker (via SPRING_PROFILES_ACTIVE=docker)
# Overrides the default H2 datasource with PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-application}:5432/applicationdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:loanflow}
    password: ${DB_PASSWORD:loanflow}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

